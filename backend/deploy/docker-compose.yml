version: "3.9"

# Production-grade compose stack for the Open-Orch control plane.
# The orchestrator manages *other* docker networks (one per environment),
# but itself lives on the shared `open_orch_edge` network alongside Traefik.

networks:
  open_orch_edge:
    name: open_orch_edge
    driver: bridge

volumes:
  postgres_data: {}
  redis_data: {}
  traefik_letsencrypt: {}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: open_orch
      POSTGRES_USER: open_orch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    networks: [open_orch_edge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_orch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [open_orch_edge]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --log.level=INFO
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks: [open_orch_edge]

  open-orch:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ORCH_LISTEN_ADDR: ":8080"
      ORCH_POSTGRES_DSN: postgres://open_orch:${POSTGRES_PASSWORD}@postgres:5432/open_orch?sslmode=disable
      ORCH_REDIS_ADDR: redis:6379
      ORCH_DOCKER_HOST: unix:///var/run/docker.sock
      ORCH_BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN}
      ORCH_GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      ORCH_GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      ORCH_GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET}
      ORCH_BUDDY_BASE_URL: ${BUDDY_BASE_URL:-https://api.buddy.works}
      ORCH_BUDDY_TOKEN: ${BUDDY_TOKEN:?set BUDDY_TOKEN}
      ORCH_BUDDY_WORKSPACE: ${BUDDY_WORKSPACE:?set BUDDY_WORKSPACE}
      ORCH_RECONCILE_INTERVAL: 15s
      ORCH_EVENT_POLL_INTERVAL: 2s
      ORCH_DEFAULT_ENV_TTL: 72h
      ORCH_DEFAULT_FALLBACK: main
      ORCH_SECRET_KEY: ${ORCH_SECRET_KEY:?set ORCH_SECRET_KEY (32 bytes hex or base64)}
      ORCH_WORKER_ID: ${HOSTNAME:-orch-1}
      ORCH_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [open_orch_edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.open-orch.rule=Host(`api.${BASE_DOMAIN}`)
      - traefik.http.routers.open-orch.entrypoints=websecure
      - traefik.http.routers.open-orch.tls.certresolver=letsencrypt
      - traefik.http.services.open-orch.loadbalancer.server.port=8080
